name: photo_slideshow_maker
description: A photo slideshow editor based on the Pixso design.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/media/
  fonts:
    - family: Poppins
      fonts:
        - asset: Poppins/Poppins-Regular.ttf
        - asset: Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: Poppins/Poppins-SemiBold.ttf
          weight: 600
